name: Backend Tests

# Runs automatically on every push and every pull request that touches
# the backend - so a broken test gets caught immediately, instead of
# only being noticed if someone remembers to run `mvn test` by hand.
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./backend
        run: mvn -B test

      - name: Publish test results summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
